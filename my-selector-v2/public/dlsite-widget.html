<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: sans-serif; color: #e5e7eb; }
</style>
</head>
<body>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var raw = params.get('c');
    if (raw) {
      try {
        window.blogparts = JSON.parse(decodeURIComponent(raw));
      } catch (e) {
        document.body.textContent = '設定の読み込みに失敗しました。';
      }
    }
  })();
</script>
<script src="https://www.dlsite.com/js/blogparts.js"></script>
</body>
</html>
